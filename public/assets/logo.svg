<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-grad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="12" y1="12" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#logo-grad)" filter="url(#glow)"/>
  
  <!-- Subtle Internal Border -->
  <rect x="2.5" y="2.5" width="35" height="35" rx="9.5" stroke="white" stroke-opacity="0.2"/>

  <!-- Pilot Paper Airplane / Navigation Chevron -->
  <path d="M12 28L28 12L20 30L17 23L12 28Z" fill="white" fill-opacity="0.95"/>
  <path d="M28 12L17 23L22 17L28 12Z" fill="url(#accent-grad)"/>

  <!-- AI Pulse Beacon -->
  <circle cx="28" cy="12" r="2.5" fill="#38BDF8"/>
  <circle cx="28" cy="12" r="4.5" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
</svg>
